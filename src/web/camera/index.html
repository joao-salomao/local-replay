<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- "Add to Home Screen" runs the camera page standalone (no Safari chrome) — the closest thing
       to fullscreen the iPhone offers, since iOS has no element Fullscreen API. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Local Replay" />
  <title>Câmera — Local Replay</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/assets/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="page">
    <div class="page-head">
      <a class="back" id="back" href="/" aria-label="Voltar para a escolha de função">←</a>
      <h1><img class="h1-mark" src="/assets/favicon.svg" alt="" width="32" height="32" />Câmera</h1>
    </div>
    <div class="card" id="setup">
      <label class="field-label" for="angle-name">Nome do ângulo</label>
      <input id="angle-name" placeholder="Nome do ângulo (ex: Fundo)" />
      <button type="button" id="start" class="btn-lg">Iniciar câmera</button>
      <div class="error" id="camera-error"></div>
    </div>
    <div class="card" id="live" hidden>
      <!-- Lives inside `#live`, not as a page-level sibling: both fullscreen modes (real and
           pseudo) cover the page and `body.no-scroll` blocks scrolling to anything outside, so a
           sibling banner would be unreachable exactly when a visibilitychange recovery — the
           thing this banner reports — is most likely to overlap a tap on GRAVAR. Placed above
           `.video-stage` so it doesn't shove the preview down when it fires mid-game. Hidden by
           default, so it costs no layout space until then. -->
      <div class="banner" id="hidden-banner" hidden>⚠️ A tela ficou oculta — buffer reiniciado. Mantenha esta página aberta e o celular na tomada.</div>
      <div class="video-stage">
        <video id="preview" autoplay muted playsinline></video>
        <p class="muted orient-hint" id="orient-hint" hidden>↔️ Vire o celular para a horizontal</p>
        <button type="button" id="fullscreen-toggle" class="fs-toggle">⛶ Tela cheia</button>
        <button type="button" id="cam-record" class="cam-record-btn" disabled>GRAVAR</button>
      </div>
      <p class="muted" id="fs-hint" hidden>
        📱 No iPhone, para tela cheia sem a barra do Safari: <strong>Compartilhar → Adicionar à Tela
        de Início</strong> e abra o app pelo ícone.
      </p>
      <select id="camera-select" hidden></select>
      <div class="status-panel">
        <p class="row"><span class="status-dot" id="conn-dot"></span><span id="conn-text">Desconectado</span></p>
        <p class="muted" id="media-info"></p>
        <p id="buffer-status" class="muted"></p>
        <p class="error" id="upload-error"></p>
        <p class="error" id="record-error"></p>
      </div>
    </div>
  </div>
  <script type="module" src="/assets/camera.js"></script>
</body>
</html>
